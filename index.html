<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Water Tracker</title>

<script src="https://cdn.tailwindcss.com"></script>
<script> tailwind.config = { darkMode: 'class' } </script>

<style>
body{
    transition: background-color .4s, color .4s;
    background:#f0f4ff;
    color:#1d1d1f;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
body.dark{ background:#050505;color:#fff }

.bg-layer{
    position:fixed;
    inset:0;
    z-index:-10;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    transition:.4s;
}

.liquid-glass{
    background:rgba(255,255,255,.3);
    backdrop-filter:blur(40px) saturate(180%);
    border:1px solid rgba(255,255,255,.4);
}

body.dark .liquid-glass{
    background:rgba(40,40,40,.3);
    border:1px solid rgba(255,255,255,.1);
}

.fullscreen-menu{
    position:fixed;
    inset:0;
    z-index:60;
    background:inherit;
    transform:translateX(-100%);
    transition:.4s;
    overflow:auto;
}
.fullscreen-menu.show{ transform:translateX(0) }
</style>
</head>

<body class="flex flex-col items-center h-screen overflow-hidden relative">

<div id="user-bg-layer" class="bg-layer hidden"></div>

<button onclick="openSettings()" 
class="liquid-glass w-14 h-14 rounded-full mt-6 flex items-center justify-center">
⚙️
</button>

<h1 class="text-4xl mt-10 font-bold">Water Tracker</h1>

<!-- USTAWIENIA -->
<div id="settings-screen" class="fullscreen-menu p-6 pt-20">

<button onclick="closeSettings()" 
class="mb-8 text-xl">⬅</button>

<h2 class="text-2xl font-bold mb-6">Tapeta</h2>

<div class="grid grid-cols-3 gap-4">

<button onclick="setPresetWallpaper(`url('assets/wallpapers/bg1.jpeg')`)"
class="aspect-[2/3] rounded-xl bg-cover bg-center"
style="background-image:url('assets/wallpapers/bg1.jpeg')">
</button>

<button onclick="setPresetWallpaper(`url('assets/wallpapers/bg2.jpeg')`)"
class="aspect-[2/3] rounded-xl bg-cover bg-center"
style="background-image:url('assets/wallpapers/bg2.jpeg')">
</button>

<button onclick="setPresetWallpaper(`url('assets/wallpapers/bg3.jpeg')`)"
class="aspect-[2/3] rounded-xl bg-cover bg-center"
style="background-image:url('assets/wallpapers/bg3.jpeg')">
</button>

</div>

<div class="mt-10">
<button onclick="clearBg()" class="text-red-500 font-bold">
Resetuj tapetę
</button>
</div>

</div>

<script>
function openSettings(){
    document.getElementById('settings-screen').classList.add('show');
}

function closeSettings(){
    document.getElementById('settings-screen').classList.remove('show');
}

function setPresetWallpaper(cssUrl){
    localStorage.setItem('customBg', cssUrl);
    applyBg();
    closeSettings();
}

function applyBg(){
    const bg = localStorage.getItem('customBg');
    const layer = document.getElementById('user-bg-layer');

    if(bg){
        layer.style.backgroundImage = bg;
        layer.classList.remove('hidden');
    }
}

function clearBg(){
    localStorage.removeItem('customBg');
    document.getElementById('user-bg-layer').classList.add('hidden');
}

applyBg();
</script>

</body>
</html>
